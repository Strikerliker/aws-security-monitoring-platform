name: AWS Security Monitoring Platform

on:
  push:
    paths:
      - "terraform/**"
      - "docs/**"
      - "queries/**"
      - "dashboard.html"
      - ".github/workflows/aws-security-monitoring-platform.yml"
      - "README.md"
  pull_request:
    paths:
      - "terraform/**"
      - "docs/**"
      - "queries/**"
      - "dashboard.html"
      - ".github/workflows/aws-security-monitoring-platform.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format Check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate
